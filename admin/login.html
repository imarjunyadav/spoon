<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#eb1700">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Login - SPOON Admin</title>
  
  <!-- Supabase Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.4/dist/umd/supabase.min.js"></script>
  
  <!-- Centralized configuration -->
  <script src="../js/config.js"></script>
  
  <style>
    :root {
      /* Brand colors - calmer red-pink for admin */
      --brand-primary: #e05265;
      --brand-primary-dark: #c9475a;
      --brand-primary-light: #fff5f6;
      
      /* Text hierarchy */
      --text-primary: #1a1a1a;
      --text-secondary: #5c5c5c;
      --text-muted: #9ca3af;
      
      /* Backgrounds */
      --bg-page: #f8f9fa;
      --bg-white: #ffffff;
      
      /* Borders */
      --border-color: #e5e7eb;
      --border-focus: #d1d5db;
      
      /* States */
      --error-red: #dc4a5a;
      --error-bg: #fef2f3;
      --error-border: #fecdd3;
      --success-green: #22c55e;
      
      /* Spacing & sizing */
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.06);
      --shadow-input: 0 1px 2px rgba(0, 0, 0, 0.04);
      
      /* Transitions */
      --transition: 150ms ease;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text-primary);
      background: var(--bg-page);
      -webkit-font-smoothing: antialiased;
    }
    
    .login-page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      padding-top: env(safe-area-inset-top, 24px);
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
    
    /* Header / Branding - Clear hierarchy */
    .login-header {
      text-align: center;
      padding: 40px 0 32px;
    }
    
    .login-brand {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    
    .login-brand span {
      color: var(--brand-primary);
    }
    
    .login-subtitle {
      font-size: 15px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.4;
    }
    
    /* Form Container */
    .login-form {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 380px;
      width: 100%;
      margin: 0 auto;
    }
    
    .form-group {
      margin-bottom: 18px;
    }
    
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }
    
    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      font-size: 15px;
      color: var(--text-primary);
      background: var(--bg-white);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xs);
      box-shadow: var(--shadow-input);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      -webkit-appearance: none;
      appearance: none;
    }
    
    .form-input:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(224, 82, 101, 0.12);
    }
    
    .form-input::placeholder {
      color: var(--text-muted);
    }
    
    /* Error message - Calm, readable */
    .form-error {
      display: none;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 14px;
      font-weight: 450;
      line-height: 1.45;
      color: var(--error-red);
      background: var(--error-bg);
      border-radius: var(--radius-xs);
      border: 1px solid var(--error-border);
    }
    
    .form-error.visible {
      display: block;
    }
    
    /* Login Button - Calm brand, accessible */
    .login-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 48px;
      margin-top: 6px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--brand-primary);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    
    .login-btn:hover {
      background: var(--brand-primary-dark);
    }
    
    .login-btn:active {
      transform: scale(0.98);
      background: var(--brand-primary-dark);
    }
    
    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }
    
    .login-btn:focus-visible {
      outline: 2px solid var(--brand-primary);
      outline-offset: 2px;
    }
    
    .login-btn .btn-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    
    /* Footer - Unobtrusive */
    .login-footer {
      text-align: center;
      padding-top: 28px;
      margin-top: auto;
    }
    
    .login-footer-text {
      font-size: 12px;
      font-weight: 450;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
    
    /* Overlays */
    .overlay {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(255,255,255,0.96);
      z-index: 100;
    }
    
    .overlay.visible {
      display: flex;
    }
    
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border-color);
      border-top-color: var(--brand-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .overlay-text {
      margin-top: 14px;
      font-size: 14px;
      font-weight: 450;
      color: var(--text-secondary);
    }
    
    /* Error Overlay */
    .error-overlay .overlay-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }
    
    .error-overlay .overlay-message {
      font-size: 14px;
      font-weight: 450;
      color: var(--text-primary);
      text-align: center;
      max-width: 260px;
      line-height: 1.5;
      margin-bottom: 18px;
    }
    
    .retry-btn {
      height: 44px;
      padding: 0 28px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: var(--brand-primary);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition);
    }
    
    .retry-btn:hover,
    .retry-btn:active {
      background: var(--brand-primary-dark);
    }
    
    /* Access Denied Modal */
    .modal-overlay {
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    
    .modal-card {
      background: var(--bg-white);
      padding: 28px 24px;
      border-radius: var(--radius);
      text-align: center;
      max-width: 300px;
      width: 100%;
      box-shadow: var(--shadow-card);
    }
    
    .modal-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }
    
    .modal-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    
    .modal-message {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }
    
    .modal-support {
      font-size: 13px;
      font-weight: 500;
      color: var(--brand-primary);
      margin-bottom: 14px;
    }
    
    .modal-redirect {
      font-size: 12px;
      color: var(--text-muted);
    }
    
    /* Tablet+ - Card layout */
    @media (min-width: 600px) {
      .login-page {
        justify-content: center;
        padding: 40px;
      }
      
      .login-header {
        padding: 0 0 36px;
      }
      
      .login-form {
        background: var(--bg-white);
        padding: 28px 28px 24px;
        border-radius: var(--radius);
        box-shadow: var(--shadow-card);
      }
      
      .login-footer {
        padding-top: 20px;
      }
    }
  </style>
</head>
<body>
  <!-- Verifying Overlay -->
  <div id="verifying-overlay" class="overlay">
    <div class="spinner"></div>
    <div class="overlay-text">Verifying access...</div>
  </div>
  
  <!-- Error Overlay -->
  <div id="error-overlay" class="overlay error-overlay">
    <div class="overlay-icon">⚠️</div>
    <div id="error-message" class="overlay-message">An error occurred. Please try again.</div>
    <button id="retry-btn" class="retry-btn" onclick="retryLogin()">Retry</button>
  </div>
  
  <!-- Access Denied Modal -->
  <div id="access-denied-modal" class="overlay modal-overlay">
    <div class="modal-card">
      <div class="modal-icon">🔒</div>
      <div class="modal-title">Access Denied</div>
      <div class="modal-message">You don't have admin privileges.</div>
      <div class="modal-support">Contact support@spoon.com for access</div>
      <div class="modal-redirect">Redirecting...</div>
    </div>
  </div>

  <div class="login-page">
    <header class="login-header">
      <h1 class="login-brand"><span>SPOON</span> Admin</h1>
      <p class="login-subtitle">Sign in to manage orders</p>
    </header>
    
    <form class="login-form" onsubmit="login(event)">
      <div id="auth-error" class="form-error"></div>
      
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          placeholder="admin@example.com"
          autocomplete="email"
          required>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="Enter password"
          autocomplete="current-password"
          required>
      </div>
      
      <button type="submit" id="login-btn" class="login-btn"><span class="btn-text">Sign in</span></button>
    </form>
    
    <footer class="login-footer">
      <p class="login-footer-text">Staff access only</p>
    </footer>
  </div>

  <script>
    let supabase = null;
    let retryCount = 0;
    const MAX_RETRIES = 3;
    let lastCredentials = { email: '', password: '' };
    
    // Initialize when config is loaded
    window.waitForConfig().then(() => {
      supabase = window.getSupabaseClient();
      if (!supabase) {
        showAuthError("Failed to connect. Please refresh.");
      }
    });

    function showOverlay(id) {
      document.querySelectorAll('.overlay').forEach(el => el.classList.remove('visible'));
      document.getElementById(id)?.classList.add('visible');
    }

    function hideOverlays() {
      document.querySelectorAll('.overlay').forEach(el => el.classList.remove('visible'));
    }

    function showAuthError(message) {
      const errorDiv = document.getElementById('auth-error');
      errorDiv.textContent = message;
      errorDiv.classList.add('visible');
    }

    function hideAuthError() {
      document.getElementById('auth-error').classList.remove('visible');
    }

    function showErrorWithRetry(message) {
      retryCount++;
      const errorMessage = document.getElementById('error-message');
      const retryBtn = document.getElementById('retry-btn');
      
      if (retryCount >= MAX_RETRIES) {
        errorMessage.textContent = "Unable to verify access. Contact support@spoon.com";
        retryBtn.style.display = 'none';
      } else {
        errorMessage.textContent = message;
        retryBtn.style.display = 'inline-block';
      }
      
      showOverlay('error-overlay');
    }

    function showAccessDeniedModal() {
      showOverlay('access-denied-modal');
      supabase.auth.signOut();
      setTimeout(() => { window.location.href = "../index.html"; }, 3000);
    }

    function setLoginButtonState(disabled) {
      const btn = document.getElementById('login-btn');
      btn.disabled = disabled;
      if (disabled) {
        btn.innerHTML = '<span class="btn-spinner"></span><span class="btn-text">Signing in</span>';
      } else {
        btn.innerHTML = '<span class="btn-text">Sign in</span>';
      }
    }

    async function verifyAdminAccess(accessToken) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        
        const response = await fetch(`${window.SPOON_CONFIG.API_BASE_URL}/api/admin/verify`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if (response.status === 401) {
          await supabase.auth.signOut();
          hideOverlays();
          showAuthError("Session invalid. Please try again.");
          return false;
        }
        
        if (response.status === 500 || !response.ok) {
          showErrorWithRetry("Server error. Please try again.");
          return false;
        }
        
        const data = await response.json();
        
        if (data.isAdmin === true) {
          retryCount = 0;
          window.location.href = "admin-mobile.html";
          return true;
        } else {
          showAccessDeniedModal();
          return false;
        }
      } catch (error) {
        console.error("Admin verification error:", error);
        await supabase.auth.signOut();
        
        if (error.name === 'AbortError') {
          showErrorWithRetry("Request timed out. Please try again.");
        } else {
          showErrorWithRetry("Network error. Check your connection.");
        }
        return false;
      }
    }

    async function retryLogin() {
      hideOverlays();
      if (lastCredentials.email && lastCredentials.password) {
        await performLogin(lastCredentials.email, lastCredentials.password);
      }
    }

    async function performLogin(email, password) {
      hideAuthError();
      setLoginButtonState(true);
      
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        setLoginButtonState(false);
        showAuthError("Login failed: " + error.message);
        return;
      }

      showOverlay('verifying-overlay');
      await verifyAdminAccess(data.session.access_token);
      setLoginButtonState(false);
    }

    async function login(e) {
      e.preventDefault();
      
      if (!supabase) {
        showAuthError("Not connected. Please refresh.");
        return;
      }
      
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      
      lastCredentials = { email, password };
      await performLogin(email, password);
    }
  </script>
</body>
</html>
