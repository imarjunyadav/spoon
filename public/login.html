<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Welcome - Spoon</title>
    <!-- We will use the new unified auth.css file -->
    <meta name="theme-color" content="#eb1700">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/legal.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>

<body>

    <div class="app-container auth-container">

        <!-- ============== HEADER ============== -->
        <header class="auth-header">
            <a href="index.html" class="auth-header__back-btn" aria-label="Back to home">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </header>

        <!-- ============== MAIN CONTENT ============== -->
        <main class="auth-main">

            <div class="auth-title-block">
                <h1 class="auth-title">Welcome to Spoon</h1>
                <p class="auth-subtitle">Enter your email to get started</p>
            </div>

            <!-- Email input group -->
            <div class="email-input-group">
                <i class="fa-solid fa-envelope email-icon"></i>
                <input type="email" class="email-input" id="email-input" placeholder="you@example.com" inputmode="email" autocomplete="email">
            </div>
            <p class="input-hint" id="email-hint"></p>

            <!-- This form will be at the bottom of the screen -->
            <form class="auth-form" id="login-form">
                <button type="submit" class="btn--primary btn--full-width" id="continue-btn" disabled>
                    Continue
                </button>
            </form>

            <div class="auth-legal-links">
                <a href="privacy.html">Privacy</a>
                <a href="terms.html">Terms</a>
                <a href="refund.html">Refund</a>
                <a href="contact.html">Contact</a>
            </div>

        </main>

    </div>

    <script src="../js/auth/login.js" defer></script>
    <script src="../js/core/storage-notice.js" defer></script>

</body>

</html>
