<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#eb1700">
    <link rel="apple-touch-icon" href="/public/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Spoon">
    <title>Spoon - Canteen Ordering</title>
    <meta name="description"
        content="Skip the canteen queue at TCET. Order and pay ahead on Spoon, then pick up when it's ready.">
    <!-- Open Graph / social sharing. og:image is a RELATIVE path (no domain hardcoded,
         since the production domain isn't finalized). When the domain is set, make the
         image URL absolute (or inject it from FRONTEND_URL) for reliable link previews. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Spoon">
    <meta property="og:title" content="Spoon — Skip the canteen queue">
    <meta property="og:description" content="Order and pay ahead at the TCET canteen, then pick up when it's ready.">
    <meta property="og:image" content="/public/icons/icon-512.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Spoon — Skip the canteen queue">
    <meta name="twitter:description" content="Order and pay ahead at the TCET canteen, then pick up when it's ready.">
    <meta name="twitter:image" content="/public/icons/icon-512.png">
    <!-- Link to our new stylesheet -->
    <link rel="stylesheet" href="../css/menu.css">
    <!-- Font Awesome for icons, as used in the sample UI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <!-- Minimal header + install-promo styles -->
    <style>
        .spoon-header { padding: 18px 20px 8px; text-align: center; }
        .spoon-header__title { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: 2px; color: #eb1700; }
        .spoon-header__tagline { margin: 4px 0 0; font-size: 13px; color: #8a8a8a; }
        .spoon-header__tagline .sep { color: #d0d0d0; margin: 0 6px; }

        .pwa-promo-section { margin: 0 0 10px; }
        .pwa-promo {
            width: 100%; display: flex; align-items: center; gap: 12px;
            background: linear-gradient(135deg, #eb1700, #ff5b3a);
            color: #fff; border: none; border-radius: 14px; padding: 14px 16px;
            text-align: left; cursor: pointer; font-family: inherit;
            box-shadow: 0 6px 18px rgba(235, 23, 0, .25);
        }
        .pwa-promo:active { transform: scale(.99); }
        .pwa-promo__icon { font-size: 24px; flex-shrink: 0; }
        .pwa-promo__text { flex: 1; display: flex; flex-direction: column; }
        .pwa-promo__text strong { font-size: 15px; font-weight: 700; }
        .pwa-promo__text small { font-size: 12px; opacity: .92; line-height: 1.35; margin-top: 2px; }
        .pwa-promo__cta { font-size: 22px; flex-shrink: 0; }
        .pwa-promo-section[hidden] { display: none; }
    </style>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.4/dist/umd/supabase.min.js"></script>
</head>

<body>

    <!-- Main container for the app, providing a consistent frame -->
    <div class="app-container">

        <!-- ============== HEADER ============== -->
        <header class="spoon-header">
            <h1 class="spoon-header__title">SPOON</h1>
            <p class="spoon-header__tagline">Order<span class="sep">·</span>We'll notify you<span class="sep">·</span>Come collect.</p>
        </header>

        <!-- ============== SEARCH ============== -->
        <!-- This section is sticky, so it stays at the top on scroll -->
        <section class="search-section">
            <div class="search-bar">
                <i class="fa-solid fa-search"></i>
                <input type="text" class="search-bar__input" id="search-input"
                    placeholder="Search for food, snacks, etc.">
            </div>
        </section>


        <!-- ============== MAIN CONTENT ============== -->
        <main class="main-content">

            <!-- --- Install Spoon promo (replaces the old ad space) --- -->
            <section class="pwa-promo-section" id="pwa-promo-section">
                <button type="button" class="pwa-promo" id="pwa-promo">
                    <span class="pwa-promo__icon"><i class="fa-solid fa-mobile-screen-button"></i></span>
                    <span class="pwa-promo__text">
                        <strong>Install the Spoon app</strong>
                        <small>Faster access &amp; a smoother ordering experience — add Spoon to your home screen.</small>
                    </span>
                    <span class="pwa-promo__cta"><i class="fa-solid fa-circle-down"></i></span>
                </button>
            </section>

            <!-- --- Categories --- -->
            <section class="categories-section" id="categories-section">
                <h2 class="section-title">Explore by Category</h2>
                <!-- Dynamic: Category chips will be rendered here by JS -->
                <div class="categories-container no-scrollbar" id="categories-container">
                    <!-- Example Chip: <button class="category-chip active">Sandwich</button> -->
                </div>
            </section>

            <!-- --- Product List --- -->
            <section class="products-section">
                <h2 class="section-title" id="product-list-title">Sandwiches</h2>
                <!-- Dynamic: Product cards for the selected category will be rendered here by JS -->
                <div class="products-grid" id="products-grid">
                    <!-- Example Card: 
                    <div class="product-card">
                        <div class="product-card__info">
                            <h4>Veg Sandwich</h4>
                            <p>₹30</p>
                        </div>
                        <button class="product-card__add-btn"><i class="fa-solid fa-plus"></i></button>
                    </div> 
                    -->
                </div>
            </section>

        </main>

        <!-- ============== BOTTOM NAVIGATION ============== -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <i class="fa-solid fa-utensils nav-item__icon"></i>
                <span class="nav-item__label">Menu</span>
            </a>
            <a href="cart.html" class="nav-item">
                <i class="fa-solid fa-basket-shopping nav-item__icon"></i>
                <span class="nav-item__label">Cart</span>
                <!-- Cart badge, initially hidden -->
                <span class="nav-item__badge" id="cart-badge">0</span>
            </a>
            <a href="orders.html" class="nav-item">
                <i class="fa-solid fa-receipt nav-item__icon"></i>
                <span class="nav-item__label">Orders</span>
            </a>
            <a href="account.html" class="nav-item">
                <i class="fa-solid fa-user nav-item__icon"></i>
                <span class="nav-item__label">Account</span>
            </a>
        </nav>

    </div>

    <!-- Toast notification utility -->
    <script src="../js/core/toast.js"></script>
    <!-- Centralized configuration (must load before other scripts) -->
    <script src="../js/core/config.js"></script>
    <!-- Session Guard (Enforces Single Device Policy) -->
    <script src="../js/core/session-guard.js"></script>
    <!-- Link to our new JavaScript files -->
    <script src="../js/pages/menu.js"></script>
    <!-- Deferred PWA install prompt + one-time local-storage notice -->
    <script src="../js/core/pwa-install.js" defer></script>
    <script src="../js/core/storage-notice.js" defer></script>
    <!-- User order-update push notifications (deferred, opt-in) -->
    <script src="../js/services/userPushManager.js" defer></script>
</body>

</html>
