<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Spoon</title>
  
  <!-- Supabase Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.4/dist/umd/supabase.min.js"></script>
  
  <!-- Centralized configuration -->
  <script src="../js/config.js"></script>
  
  <!-- Initialize Supabase and Check Session -->
  <script>
    let supabase = null;
    let retryCount = 0;
    const MAX_RETRIES = 3;
    
    async function initAdmin() {
      // Wait for config to load
      await window.waitForConfig();
      supabase = window.getSupabaseClient();
      
      if (!supabase) {
        showErrorWithRetry("Failed to connect to database.");
        return;
      }
      
      const isAdmin = await checkSession();
      if (isAdmin) {
        hideLoadingOverlay();
        fetchOrders();
        fetchMenuItems();
      }
    }

    async function checkSession() {
      showLoadingOverlay();
      
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
        return false;
      }
      
      // Verify admin status via backend API
      return await verifyAdminAccess(session.access_token);
    }

    async function verifyAdminAccess(accessToken) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000); // 10s timeout
        
        const response = await fetch(`${window.SPOON_CONFIG.API_BASE_URL}/api/admin/verify`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          signal: controller.signal
        });
        
        clearTimeout(timeoutId);
        
        if (response.status === 401) {
          // Token invalid/expired - redirect to login
          await supabase.auth.signOut();
          window.location.href = "login.html";
          return false;
        }
        
        if (response.status === 500 || !response.ok) {
          // Server error - show error with retry
          showErrorWithRetry("Server error. Please try again.");
          return false;
        }
        
        const data = await response.json();
        
        if (data.isAdmin === true) {
          retryCount = 0; // Reset retry count on success
          return true;
        } else {
          // User is not an admin
          showAccessDeniedModal();
          return false;
        }
      } catch (error) {
        console.error("Admin verification error:", error);
        
        if (error.name === 'AbortError') {
          showErrorWithRetry("Request timed out. Please try again.");
        } else {
          showErrorWithRetry("Network error. Please check your connection.");
        }
        return false;
      }
    }

    function showLoadingOverlay() {
      document.getElementById('loading-overlay').style.display = 'flex';
      document.getElementById('error-overlay').style.display = 'none';
      document.getElementById('access-denied-modal').style.display = 'none';
    }

    function hideLoadingOverlay() {
      document.getElementById('loading-overlay').style.display = 'none';
    }

    function showErrorWithRetry(message) {
      hideLoadingOverlay();
      const errorOverlay = document.getElementById('error-overlay');
      const errorMessage = document.getElementById('error-message');
      const retryBtn = document.getElementById('retry-btn');
      
      retryCount++;
      
      if (retryCount >= MAX_RETRIES) {
        errorMessage.textContent = "Unable to verify admin access. Please contact support@spoon.com";
        retryBtn.style.display = 'none';
      } else {
        errorMessage.textContent = message;
        retryBtn.style.display = 'inline-block';
      }
      
      errorOverlay.style.display = 'flex';
    }

    async function retryVerification() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = "login.html";
        return;
      }
      
      document.getElementById('error-overlay').style.display = 'none';
      showLoadingOverlay();
      
      const isAdmin = await verifyAdminAccess(session.access_token);
      if (isAdmin) {
        hideLoadingOverlay();
        fetchOrders();
        fetchMenuItems();
      }
    }

    function showAccessDeniedModal() {
      hideLoadingOverlay();
      document.getElementById('access-denied-modal').style.display = 'flex';
      
      // Sign out user
      supabase.auth.signOut();
      
      // Redirect to homepage after 3 seconds
      setTimeout(() => {
        window.location.href = "../index.html";
      }, 3000);
    }

    // Initialize when DOM is ready
    document.addEventListener('DOMContentLoaded', initAdmin);
  </script>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      height: 100vh;
      margin: 0;
    }
    .column {
      flex: 1;
      padding: 10px;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }
    .column:last-child {
      border-right: none;
    }
    h2 {
      text-align: center;
    }
    .item, .order {
      border: 1px solid #ddd;
      padding: 8px;
      margin: 6px 0;
    }
    .item:hover {
      background: #f0f0f0;
      cursor: pointer;
    }
    button {
      background: #007bff;
      color: white;
      padding: 5px 8px;
      margin-top: 6px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    
    /* Loading Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .loading-text {
      margin-top: 16px;
      font-size: 16px;
      color: #666;
    }
    
    /* Error Overlay */
    .error-overlay {
      background: rgba(255, 255, 255, 0.98);
    }
    
    .error-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    .error-message {
      font-size: 16px;
      color: #333;
      margin-bottom: 20px;
      text-align: center;
      max-width: 300px;
    }
    
    .retry-btn {
      background: #007bff;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .retry-btn:hover {
      background: #0056b3;
    }
    
    /* Access Denied Modal */
    .modal-overlay {
      background: rgba(0, 0, 0, 0.5);
    }
    
    .modal-content {
      background: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
    
    .modal-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    .modal-title {
      font-size: 24px;
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
    }
    
    .modal-message {
      font-size: 16px;
      color: #666;
      margin-bottom: 8px;
    }
    
    .modal-support {
      font-size: 14px;
      color: #007bff;
      margin-bottom: 16px;
    }
    
    .modal-redirect {
      font-size: 14px;
      color: #999;
    }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loading-overlay" class="overlay" style="display: flex;">
    <div class="loading-spinner"></div>
    <div class="loading-text">Verifying admin access...</div>
  </div>
  
  <!-- Error Overlay -->
  <div id="error-overlay" class="overlay error-overlay" style="display: none;">
    <div class="error-icon">⚠️</div>
    <div id="error-message" class="error-message">An error occurred. Please try again.</div>
    <button id="retry-btn" class="retry-btn" onclick="retryVerification()">Retry</button>
  </div>
  
  <!-- Access Denied Modal -->
  <div id="access-denied-modal" class="overlay modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-icon">⚠️</div>
      <div class="modal-title">Access Denied</div>
      <div class="modal-message">You don't have admin privileges.</div>
      <div class="modal-support">Contact support@spoon.com if you need admin access.</div>
      <div class="modal-redirect">Redirecting to homepage...</div>
    </div>
  </div>

  <div class="column" id="items-column">
    <h2>Items to Prepare</h2>
    <div id="items-list"></div>
  </div>

  <div class="column" id="active-orders-column">
    <h2>Active Orders</h2>
    <div id="active-orders-list"></div>
  </div>

  <div class="column" id="completed-orders-column">
    <h2>Completed Orders</h2>
    <div id="completed-orders-list"></div>
  </div>

  <div class="column" id="stock-management-column">
    <h2>Stock Management</h2>
    <div id="stock-items-list"></div>
  </div>

  <script>
    
    let allOrders = [];
    let selectedItem = null;

    async function fetchOrders() {
      const { data, error } = await supabase.from('orders').select('*');
      if (error) return console.error("❌ Error fetching orders:", error);
      allOrders = data;
      console.log("📦 Orders fetched:", allOrders);
      renderAll();
    }

    function getItemSummary() {
      const summary = {};
      allOrders
        .filter(o => o.status === 'PENDING')
        .forEach(order => {
          order.items.forEach(item => {
            summary[item.title] = (summary[item.title] || 0) + item.quantity;
          });
        });
      return summary;
    }

    function renderAll() {
      renderItems();
      renderActiveOrders();
      renderCompletedOrders();
    }

    function renderItems() {
      const itemsList = document.getElementById('items-list');
      itemsList.innerHTML = '';
      const summary = getItemSummary();
      Object.entries(summary).forEach(([title, quantity]) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.textContent = `${title} — ${quantity}`;
        div.onclick = () => {
          selectedItem = selectedItem === title ? null : title;
          renderActiveOrders();
        };
        itemsList.appendChild(div);
      });
    }

    function renderActiveOrders() {
      const list = document.getElementById('active-orders-list');
      list.innerHTML = '';
      const filtered = allOrders.filter(o =>
        o.status === 'PENDING'
      );

      filtered.forEach(order => {
        if (selectedItem && !order.items.some(i => i.title === selectedItem)) return;
        const div = document.createElement('div');
        div.className = 'order';
        div.innerHTML = `
          <strong>Order:</strong> ${order.id}<br>
          <strong>Items:</strong><ul>
            ${order.items.map(i => `<li>${i.title} x${i.quantity}</li>`).join('')}
          </ul>
          <button onclick="markComplete('${order.id}')">Mark Complete</button>
        `;
        list.appendChild(div);
      });
    }

    function renderCompletedOrders() {
      const list = document.getElementById('completed-orders-list');
      list.innerHTML = '';
      const filtered = allOrders.filter(o => o.status === 'COMPLETE');

      filtered.forEach(order => {
        const div = document.createElement('div');
        div.className = 'order';
        div.innerHTML = `
          <strong>Order:</strong> ${order.id}<br>
          <strong>Items:</strong><ul>
            ${order.items.map(i => `<li>${i.title} x${i.quantity}</li>`).join('')}
          </ul>
          <p><strong>Verification Code:</strong> ${order.verification_code || '-'}</p>
          <button onclick="markPickedUp('${order.id}')">Picked Up</button>
        `;
        list.appendChild(div);
      });
    }

    async function markComplete(orderId) {
      console.log("🔄 Marking order as COMPLETE:", orderId);

      try {
        const response = await fetch(`${window.SPOON_CONFIG.API_BASE_URL}/api/orders/${orderId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'COMPLETE' })
        });

        const result = await response.json();

        if (result.success) {
          console.log('📧 Email notification + Status updated to COMPLETE');
          if (result.email && result.email.success) {
            console.log('✅ Email sent successfully:', result.email.messageId);
          } else if (result.email && !result.email.success) {
            console.warn('⚠️ Email failed:', result.email.error);
          }
          await fetchOrders();
        } else {
          console.error('❌ Error:', result.error);
          alert('Failed to update order status: ' + result.error);
        }
      } catch (error) {
        console.error('❌ Network error:', error);
        alert('Failed to connect to server. Please check if backend is running.');
      }
    }

    async function markPickedUp(orderId) {
      console.log("📦 Marking as PICKED_UP:", orderId);

      try {
        const response = await fetch(`${window.SPOON_CONFIG.API_BASE_URL}/api/orders/${orderId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'PICKED_UP' })
        });

        const result = await response.json();

        if (result.success) {
          console.log('📧 Email notification + Status updated to PICKED_UP');
          if (result.email && result.email.success) {
            console.log('✅ Email sent successfully:', result.email.messageId);
          } else if (result.email && !result.email.success) {
            console.warn('⚠️ Email failed:', result.email.error);
          }
          await fetchOrders();
        } else {
          console.error('❌ Error:', result.error);
          alert('Failed to update order status: ' + result.error);
        }
      } catch (error) {
        console.error('❌ Network error:', error);
        alert('Failed to connect to server. Please check if backend is running.');
      }
    }

    // ========================================
    // STOCK MANAGEMENT FUNCTIONS
    // ========================================
    
    let allMenuItems = [];
    
    async function fetchMenuItems() {
      const { data, error } = await supabase
        .from('menu_items')
        .select('*')
        .order('category', { ascending: true })
        .order('name', { ascending: true });
      
      if (error) {
        console.error("❌ Error fetching menu items:", error);
        return;
      }
      
      allMenuItems = data;
      console.log("📋 Menu items fetched:", allMenuItems.length);
      renderStockItems();
    }
    
    function renderStockItems() {
      const stockList = document.getElementById('stock-items-list');
      stockList.innerHTML = '';
      
      // Group by category
      const categories = {};
      allMenuItems.forEach(item => {
        if (!categories[item.category]) {
          categories[item.category] = [];
        }
        categories[item.category].push(item);
      });
      
      // Render each category
      Object.keys(categories).sort().forEach(category => {
        const categoryHeader = document.createElement('h3');
        categoryHeader.textContent = category.toUpperCase();
        categoryHeader.style.marginTop = '20px';
        categoryHeader.style.marginBottom = '10px';
        categoryHeader.style.fontSize = '14px';
        categoryHeader.style.color = '#666';
        stockList.appendChild(categoryHeader);
        
        categories[category].forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'item';
          itemDiv.style.display = 'flex';
          itemDiv.style.justifyContent = 'space-between';
          itemDiv.style.alignItems = 'center';
          
          const itemInfo = document.createElement('div');
          itemInfo.innerHTML = `
            <strong>${item.name}</strong><br>
            <small>₹${item.price}</small>
          `;
          
          const toggleBtn = document.createElement('button');
          toggleBtn.textContent = item.is_available ? 'In Stock' : 'Out of Stock';
          toggleBtn.style.background = item.is_available ? '#28a745' : '#dc3545';
          toggleBtn.style.fontSize = '12px';
          toggleBtn.style.padding = '6px 12px';
          toggleBtn.onclick = () => toggleStock(item.id, !item.is_available);
          
          itemDiv.appendChild(itemInfo);
          itemDiv.appendChild(toggleBtn);
          stockList.appendChild(itemDiv);
        });
      });
    }
    
    async function toggleStock(itemId, newAvailability) {
      // Get session token for authentication
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) {
        // No session - redirect to login
        window.location.href = "login.html";
        return;
      }
      
      try {
        const response = await fetch(`${window.SPOON_CONFIG.API_BASE_URL}/api/admin/stock/${itemId}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `Bearer ${session.access_token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ is_available: newAvailability })
        });
        
        if (response.status === 401) {
          // Token invalid/expired - redirect to login
          console.error("❌ Unauthorized - redirecting to login");
          await supabase.auth.signOut();
          window.location.href = "login.html";
          return;
        }
        
        if (response.status === 403) {
          // User is not admin - show access denied
          console.error("❌ Access denied - user is not admin");
          showAccessDeniedModal();
          return;
        }
        
        const result = await response.json();
        
        if (response.ok && result.success) {
          console.log(`✅ Stock updated for item ${itemId}: ${newAvailability ? 'Available' : 'Out of Stock'}`);
          await fetchMenuItems();
        } else {
          console.error("❌ Error updating stock:", result.error || result.message);
          alert('Failed to update stock status: ' + (result.message || result.error || 'Unknown error'));
        }
      } catch (error) {
        console.error("❌ Network error updating stock:", error);
        alert('Failed to connect to server. Please check your connection.');
      }
    }
    
    // Auto-refresh every 5 seconds for real-time updates
    setInterval(fetchOrders, 5000);
    setInterval(fetchMenuItems, 10000); // Refresh stock every 10 seconds
  </script>
</body>
</html>
