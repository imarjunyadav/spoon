<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Partner Sign In - Spoon</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>

<body>

    <div class="app-container auth-container">

        <!-- ============== HEADER ============== -->
        <header class="auth-header">
            <a href="index.html" class="auth-header__back-btn" aria-label="Back to home">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
        </header>

        <!-- ============== MAIN CONTENT ============== -->
        <main class="auth-main">

            <div class="auth-title-block">
                <h1 class="auth-title">Partner Sign In</h1>
                <p class="auth-subtitle">Sign in with your account credentials</p>
            </div>

            <form class="auth-form" id="partner-form" autocomplete="on">
                <!-- Email -->
                <div class="email-input-group">
                    <i class="fa-solid fa-envelope email-icon"></i>
                    <input type="email" class="email-input" id="email-input" name="email"
                        placeholder="you@example.com" inputmode="email" autocomplete="username" required>
                </div>

                <!-- Password -->
                <div class="email-input-group" style="margin-top: 12px;">
                    <i class="fa-solid fa-lock email-icon"></i>
                    <input type="password" class="email-input" id="password-input" name="password"
                        placeholder="Password" autocomplete="current-password" required>
                </div>

                <p class="input-hint" id="form-error" style="color:#c0392b; min-height:1em;"></p>

                <button type="submit" class="btn--primary btn--full-width" id="submit-btn">
                    Sign In
                </button>
            </form>

        </main>

    </div>

    <script src="../js/auth/partner-auth.js" defer></script>

</body>

</html>
