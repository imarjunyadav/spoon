<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Order Status - Spoon</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    
    <!-- Order Status Styles -->
    <link rel="stylesheet" href="../css/order-status.css">
    
    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.4/dist/umd/supabase.min.js"></script>
    
    <!-- Utility Classes -->
    <style>
        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="app-container">

        <!-- ============== HEADER ============== -->
        <!-- The header title ID matches the original JS requirement -->
        <header class="cart-header">
            <a href="orders.html" class="cart-header__back-btn" aria-label="Back to My Orders">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="cart-header__title" id="status-order-id-header">#SPOON-XXXX</h1>
        </header>

        <!-- ============== MAIN CONTENT ============== -->
        <main class="main-content">

            <!-- --- Order Summary Card --- -->
            <section class="order-summary-card">
                <div class="order-summary-card__header">
                    <h2 class="order-summary-card__title">Order Summary</h2>
                    <span class="order-summary-card__count" id="order-items-count">0 items</span>
                </div>
                
                <!-- Scrollable Item List -->
                <div class="order-items-list" id="summary-item-list">
                    <!-- Items will be injected here by JS -->
                </div>
                
                <!-- Order Total -->
                <div class="order-total">
                    <span class="order-total__label">Total Amount</span>
                    <span class="order-total__value" id="order-total-value">₹0</span>
                </div>
            </section>

            <!-- --- Status Timeline --- -->
            <section id="timeline-container">
                <!-- Timeline stepper + hero injected by JS -->
            </section>

        </main>

        <!-- No bottom nav on this deep-level page -->
    </div>

    <!-- Centralized configuration (must load before other scripts) -->
    <script src="../js/core/config.js"></script>
    <!-- Session Guard (Enforces Single Device Policy) -->
    <script src="../js/core/session-guard.js"></script>
    
    <!-- Horizontal Stepper Renderer (must load before order-status.js) -->
    <script src="../js/admin/timelineRenderer.js"></script>
    
    <!-- Initialize Supabase from centralized config -->
    <script>
        // Wait for config to load, then set up Supabase client
        window.waitForConfig().then(() => {
            window.supabaseClient = window.getSupabaseClient();
            if (!window.supabaseClient) {
                console.error('❌ Failed to initialize Supabase client');
            }
        });
    </script>
    
    <!-- Order Status Logic -->
    <script src="../js/pages/order-status.js"></script>

</body>

</html>
