<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Order Status - Spoon</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    
    <!-- Order Status Styles -->
    <link rel="stylesheet" href="../css/order-status.css">
    
    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.4/dist/umd/supabase.min.js"></script>
    
    <!-- Utility Classes -->
    <style>
        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="app-container">

        <!-- ============== HEADER ============== -->
        <!-- The header title ID matches the original JS requirement -->
        <header class="cart-header">
            <a href="orders.html" class="cart-header__back-btn" aria-label="Back to My Orders">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="cart-header__title" id="status-order-id-header">#SPOON-XXXX</h1>
        </header>

        <!-- ============== MAIN CONTENT ============== -->
        <main class="main-content">

            <!-- --- Order Summary Card --- -->
            <section class="order-summary-card">
                <div class="order-summary-card__header">
                    <h2 class="order-summary-card__title">Order Summary</h2>
                    <span class="order-summary-card__count" id="order-items-count">0 items</span>
                </div>
                
                <!-- Scrollable Item List -->
                <div class="order-items-list" id="summary-item-list">
                    <!-- Items will be injected here by JS -->
                </div>
                
                <!-- Order Total -->
                <div class="order-total">
                    <span class="order-total__label">Total Amount</span>
                    <span class="order-total__value" id="order-total-value">₹0</span>
                </div>
            </section>

            <!-- --- Cancel Order Section (shown for eligible pre-orders) --- -->
            <section class="cancel-order-section hidden" id="cancel-order-section">
                <div class="cancel-order-info">
                    <div class="cancel-order-timer" id="cancel-timer">
                        <i class="fa-regular fa-clock"></i>
                        <span id="cancel-timer-text">Cancel available for --:--</span>
                    </div>
                    <p class="cancel-order-note">
                        Refund will be credited as <strong>eWallet coins</strong> (1 coin = ₹1)
                    </p>
                </div>
                <button class="btn--cancel-order" id="btn-cancel-order" type="button">
                    <i class="fa-solid fa-xmark"></i>
                    Cancel Order
                </button>
            </section>

            <!-- --- Cancelled Order Badge (shown after cancellation) --- -->
            <section class="cancel-order-done hidden" id="cancel-order-done">
                <div class="cancel-done-icon">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <p class="cancel-done-text">Order cancelled</p>
                <p class="cancel-done-refund" id="cancel-done-refund">₹0 refunded as coins</p>
            </section>

            <!-- --- Vertical Timeline --- -->
            <!-- The main container ID matches the original JS -->
            <section class="timeline-section">
                <h2 class="timeline-section__title">Live Status</h2>
                <div class="timeline-container" id="timeline-container">
                    <!-- Timeline steps will be dynamically injected here by JS -->
                    <!-- Pickup code will be injected inline within the "Ready for Pickup" step -->
                </div>
            </section>

            <!-- --- Cancel Confirmation Modal --- -->
            <div class="cancel-modal-overlay hidden" id="cancel-modal-overlay">
                <div class="cancel-modal">
                    <div class="cancel-modal__header">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <h3>Cancel this order?</h3>
                    </div>
                    <div class="cancel-modal__body">
                        <p class="cancel-modal__refund">
                            <span class="cancel-modal__refund-amount" id="cancel-refund-amount">₹0</span>
                            will be refunded as eWallet coins
                        </p>
                        <div class="cancel-modal__reason">
                            <label for="cancel-reason">Reason (optional)</label>
                            <select id="cancel-reason">
                                <option value="">Select a reason</option>
                                <option value="Changed my mind">Changed my mind</option>
                                <option value="Ordered wrong items">Ordered wrong items</option>
                                <option value="Won't make it in time">Won't make it in time</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="cancel-modal__actions">
                        <button class="btn--modal-back" id="btn-cancel-back" type="button">Go Back</button>
                        <button class="btn--modal-confirm" id="btn-cancel-confirm" type="button">
                            Yes, Cancel Order
                        </button>
                    </div>
                </div>
            </div>

        </main>

        <!-- No bottom nav on this deep-level page -->
    </div>

    <!-- Centralized configuration (must load before other scripts) -->
    <script src="../js/core/config.js"></script>
    <!-- Session Guard (Enforces Single Device Policy) -->
    <script src="../js/core/session-guard.js"></script>
    
    <!-- Horizontal Stepper Renderer (must load before order-status.js) -->
    <script src="../js/admin/timelineRenderer.js"></script>
    
    <!-- Initialize Supabase from centralized config -->
    <script>
        // Wait for config to load, then set up Supabase client
        window.waitForConfig().then(() => {
            window.supabaseClient = window.getSupabaseClient();
            if (!window.supabaseClient) {
                console.error('❌ Failed to initialize Supabase client');
            }
        });
    </script>
    
    <!-- Order Status Logic -->
    <script src="../js/pages/order-status.js"></script>

</body>

</html>
