<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>My Cart - Spoon</title>
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/cart.css">
    <link rel="stylesheet" href="../css/toast.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    
    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.4/dist/umd/supabase.min.js"></script>
    
    <!-- Razorpay Payment Gateway -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body>

    <!-- Main container for the app -->
    <div class="app-container">

        <!-- ============== HEADER ============== -->
        <header class="cart-header">
            <a href="index.html" class="cart-header__back-btn" aria-label="Back to menu">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="cart-header__title">My Cart</h1>
        </header>

        <!-- ============== MAIN CONTENT ============== -->
        <main class="main-content">

            <!-- --- Native Ad Placeholder (AdSense Ready) --- -->
            <section class="ad-section">
                <div class="ad-card" id="ad-placeholder">
                    <span class="ad-card__label">Sponsored</span>
                    <div class="ad-card__content">
                        <!-- AdSense or custom ad content goes here -->
                        <div class="ad-card__placeholder">
                            <i class="fa-solid fa-rectangle-ad"></i>
                            <span>Ad Space</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- This container will be filled with cart items by JavaScript -->
            <div class="cart-items-list" id="cart-items-container">
                <!-- JS will generate cards here -->
            </div>

            <!-- This view is shown only when the cart is empty. It's hidden by default. -->
            <div class="empty-cart-view hidden" id="empty-cart-view">
                <i class="fa-solid fa-basket-shopping empty-cart-view__icon"></i>
                <h2 class="empty-cart-view__title">Your cart is empty</h2>
                <p class="empty-cart-view__message">Browse our menu and add your favorite items to get started.</p>
                <a href="index.html" class="btn--primary empty-cart-view__cta">Browse Menu</a>
            </div>

        </main>

        <!-- ============== STICKY SUMMARY FOOTER ============== -->
        <div class="cart-summary-footer" id="cart-summary-footer">
            <div>
                <div class="cart-summary-footer__subtotal-label">Subtotal</div>
                <div class="cart-summary-footer__subtotal-value" id="subtotal-value">₹0</div>
            </div>
            <button class="cart-summary-footer__cta" id="checkout-btn">Proceed to Checkout</button>
        </div>


        <!-- ============== BOTTOM NAVIGATION ============== -->
        <nav class="bottom-nav">
            <!-- (Nav items remain the same) -->
            <a href="index.html" class="nav-item">
                <i class="fa-solid fa-utensils nav-item__icon"></i>
                <span class="nav-item__label">Menu</span>
            </a>
            <a href="cart.html" class="nav-item active">
                <i class="fa-solid fa-basket-shopping nav-item__icon"></i>
                <span class="nav-item__label">Cart</span>
                <span class="nav-item__badge" id="cart-badge">0</span>
            </a>
            <a href="orders.html" class="nav-item">
                <i class="fa-solid fa-receipt nav-item__icon"></i>
                <span class="nav-item__label">Orders</span>
            </a>
            <a href="account.html" class="nav-item">
                <i class="fa-solid fa-user nav-item__icon"></i>
                <span class="nav-item__label">Account</span>
            </a>
        </nav>

    </div>

    <!-- ================================================================
         MODALS (NEW) - Hidden by default
         ================================================================ -->
    <div class="modal-overlay hidden" id="modal-overlay"></div>

    <!-- === Confirm Order Modal === -->
    <div class="modal hidden" id="confirm-order-modal">
        <div class="modal__header">
            <h2 class="modal__title">Confirm Your Order</h2>
            <button class="modal__close-btn" id="close-confirm-modal-btn"><i class="fa-solid fa-times"></i></button>
        </div>

        <!-- Order items will be listed here -->
        <div class="modal__order-summary" id="modal-order-summary"></div>

        <!-- Preorder disabled in v2 -->

        <!-- Payment Method Selection -->
        <div class="payment-method-section">
            <h3 class="payment-method-title">Payment Method</h3>
            
            <!-- Razorpay Option -->
            <label class="payment-option selected" id="opt-razorpay-label">
                <input type="radio" name="payment-method" value="razorpay" checked>
                <div class="payment-option__content">
                    <span class="payment-option__name">Pay Online</span>
                    <span class="payment-option__sub">UPI, Cards, Netbanking</span>
                </div>
                <i class="fa-solid fa-circle-check payment-option__icon"></i>
            </label>

            <!-- Wallet Option -->
            <label class="payment-option" id="opt-wallet-label">
                <input type="radio" name="payment-method" value="wallet">
                <div class="payment-option__content">
                    <span class="payment-option__name">Spoon Wallet</span>
                    <span class="payment-option__sub" id="wallet-balance-display">Balance: Loading...</span>
                </div>
                <i class="fa-solid fa-circle-check payment-option__icon"></i>
            </label>
            
            <div class="wallet-error hidden" id="wallet-error-msg">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>Insufficient wallet balance</span>
            </div>
        </div>

        <!-- Final total and action buttons -->
        <div class="modal__total">
            <span class="modal__total-label">Total to Pay</span>
            <span class="modal__total-value" id="modal-total-value">₹0</span>
        </div>
        <div class="modal__actions">
            <button class="btn--secondary" id="cancel-order-btn">Cancel</button>
            <button class="btn--primary">Confirm Order</button>
        </div>
    </div>

    <!-- Preorder modals removed in v2 -->

    <!-- Toast notification utility -->
    <script src="../js/core/toast.js"></script>
    <!-- Centralized configuration (must load before other scripts) -->
    <script src="../js/core/config.js"></script>
    <!-- Session Guard (Enforces Single Device Policy) -->
    <script src="../js/core/session-guard.js"></script>
    <!-- Link to the cart's JavaScript file -->
    <script src="../js/pages/cart.js?v=2.5"></script>
</body>

</html>
